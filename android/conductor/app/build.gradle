plugins { id 'com.android.application' }
android { namespace 'ec.fasttrip.conductor'; compileSdk 36
 defaultConfig { testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"; applicationId 'com.fasttrip.conductor'; minSdk 24; targetSdk 36; versionCode 5; versionName '1.0.4' }
 signingConfigs {
  release {
   if (System.getenv('FASTTRIP_KEYSTORE_PATH')) {
    storeFile file(System.getenv('FASTTRIP_KEYSTORE_PATH'))
    storePassword System.getenv('FASTTRIP_KEYSTORE_PASSWORD')
    keyAlias System.getenv('FASTTRIP_KEY_ALIAS')
    keyPassword System.getenv('FASTTRIP_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { if (System.getenv('FASTTRIP_KEYSTORE_PATH')) signingConfig signingConfigs.release } }
}

dependencies {
 androidTestImplementation "androidx.test:runner:1.6.2"
 androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
