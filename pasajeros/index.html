<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>FAST TRIP Pasajeros</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .bienvenida {
      min-height: 100vh;
      min-height: 100dvh;
      background-image: url("logo%20padajeros.jpeg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 30px 20px 60px;
    }

    .boton {
      background: linear-gradient(
        135deg,
        #f8df86,
        #c99a27
      );
      color: #111;
      border: none;
      border-radius: 30px;
      padding: 18px 30px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
  </style>
</head>

<body>

  <main class="bienvenida">
    <button class="boton" type="button">
      Solicitar un viaje
    </button>
  </main>

</body>
</html>
