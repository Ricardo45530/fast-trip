name: Compilar APK FAST TRIP (pruebas)
on:
  workflow_dispatch:
  push:
    branches: [preparacion-android-2026-10-28]
    paths:
      - 'conductor/**'
      - 'pasajeros/**'
      - '.github/workflows/compilar-android.yml'
permissions:
  contents: read
jobs:
  android:
    name: APK de prueba - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: conductor
            app_id: ec.fasttrip.conductor
            app_name: FAST TRIP Conductor
          - app: pasajeros
            app_id: ec.fasttrip.pasajeros
            app_name: FAST TRIP Pasajeros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Preparar proyecto Capacitor
        shell: bash
        env:
          APP_ID: ${{ matrix.app_id }}
          APP_NAME: ${{ matrix.app_name }}
          APP_DIR: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fasttrip-android/www
          cp -R "$APP_DIR"/. /tmp/fasttrip-android/www/
          cd /tmp/fasttrip-android
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          node -e 'const fs=require("fs");fs.writeFileSync("capacitor.config.json",JSON.stringify({appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:"www",server:{androidScheme:"https"}},null,2))'
          npx cap add android
          npx cap sync android
      - name: Compilar APK de prueba
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fasttrip-android/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FAST-TRIP-${{ matrix.app }}-PRUEBAS.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FAST-TRIP-${{ matrix.app }}-APK-PRUEBAS
          path: FAST-TRIP-${{ matrix.app }}-PRUEBAS.apk
          if-no-files-found: error
          retention-days: 14
